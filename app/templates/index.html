<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESA WorldCover 2021 v2 API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h1 class="mb-4">ESA WorldCover 2021 v2 API Server</h1>

                {% if user %}
                    <p class="text-muted">Logged in as <strong>{{ user.email }}</strong></p>
                    <div class="list-group mb-4">
                        <a href="/manage-users" class="list-group-item list-group-item-action">User Management</a>
                        <a href="/app-docs" class="list-group-item list-group-item-action">Application Documentation</a>
                        <a href="/docs" class="list-group-item list-group-item-action">API Documentation (/docs)</a>
                    </div>
                    <form action="/logout" method="post">
                        <button type="submit" class="btn btn-outline-secondary">Logout</button>
                    </form>
                {% else %}
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title mb-3">Login</h5>
                            {% if request.query_params.get('error') %}
                                <div class="alert alert-danger">Invalid credentials. Please try again.</div>
                            {% endif %}
                            <form action="/login" method="post">
                                <div class="mb-3">
                                    <label for="username" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="username" name="username" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="password" name="password" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Login</button>
                            </form>
                        </div>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
