<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tile Cache</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="mb-3">
      <a href="/" class="btn btn-secondary btn-sm">&larr; Back to Home</a>
    </div>
    <h1 class="mb-4">Tile Cache</h1>
    {% if tiles %}
    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Tile ID</th>
            <th>File Path</th>
            <th>Last Used</th>
            <th>Expires</th>
          </tr>
        </thead>
        <tbody>
          {% for tile in tiles %}
          <tr>
            <td>{{ tile.id }}</td>
            <td><code>{{ tile.tile_id }}</code></td>
            <td><small class="text-muted">{{ tile.file_path }}</small></td>
            <td>{{ tile.last_used_at }}</td>
            <td>{{ tile.expires_at }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    {% else %}
    <p class="text-muted">No tiles are currently cached.</p>
    {% endif %}
  </div>
</body>
</html>
